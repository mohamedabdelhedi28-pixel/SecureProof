name: SecureProof SecDevOps CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:

  # --- Job 1: Secret Detection (must pass before any build) ---
  secret-scan:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Job 2: Backend — Java 25 build, unit tests, security architecture test ---
  backend:
    name: Backend — Java 25 / Jakarta EE 11
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, run unit tests & security architecture test
        run: mvn -B -f backend/pom.xml test package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureproof-api-war
          path: backend/secureproof-api/target/secureproof-api.war
          retention-days: 7

  # --- Job 3: Frontend — Vite PWA build ---
  frontend:
    name: Frontend — React PWA (Vite + TypeScript)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build PWA
        run: npm --prefix frontend run build

      - name: Upload PWA dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureproof-pwa-dist
          path: frontend/dist/
          retention-days: 7
